<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon House – preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #050916; }
      #app { position: fixed; inset: 0; }
      neon-house-card { display: block; height: 100%; }
      #dev { position: fixed; left: 10px; bottom: 60px; z-index: 10; font: 12px system-ui, sans-serif; color: #cfe6ff;
        background: rgba(5,12,30,.85); border: 1px solid rgba(56,232,255,.3); border-radius: 10px; padding: 8px; display: grid; gap: 6px; width: 190px; }
      #dev summary { cursor: pointer; font-weight: 700; }
      #dev select, #dev button { font: inherit; background: #0c1c3d; color: #cfe6ff; border: 1px solid #234; border-radius: 6px; padding: 3px 6px; width: 100%; }
      #dev-log { color: #7fe; min-height: 14px; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <details id="dev">
      <summary>Preview controls</summary>
      <label>Weather <select id="dev-weather">
        <option>sunny</option><option>partlycloudy</option><option>cloudy</option><option selected>rainy</option><option>pouring</option>
        <option>lightning-rainy</option><option>snowy</option><option>fog</option><option>clear-night</option>
      </select></label>
      <label>Sun <select id="dev-sun"><option value="day">Day</option><option value="night">Night</option></select></label>
      <div id="dev-buttons" style="display:grid;gap:6px"></div>
      <div id="dev-log"></div>
    </details>
    <script type="module" src="/src/preview/main.ts"></script>
  </body>
</html>
